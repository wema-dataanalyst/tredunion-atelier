# Contrôles croisés entre sources (ecart_somme | rapprochement | mensuel)
- id: c1
  type: ecart_somme
  libelle: CA Akanea contre comptes 70
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_akanea, valeur: montant, date: date_chgt}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_credit - soldes_debit, filtre: "numero_compte like '70%'"}
  porte_sur: [flux:f1, sftp_euro_trans_chanet_akanea.montant, sftp_euro_trans_chanet_balance#regle1]
- id: c1a
  type: ecart_somme
  libelle: CA affrètement Akanea contre comptes 7064 et 7069 affrètement
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_akanea, valeur: montant, date: date_chgt, filtre: "activite in ('AN', 'AI')"}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_credit - soldes_debit, filtre: "numero_compte in (70640000, 70641000, 70692000, 70693000)"}
  porte_sur: [flux:f2]
- id: c1b
  type: ecart_somme
  libelle: CA transport Akanea contre comptes 7060, 7061, 70690, 70691
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_akanea, valeur: montant, date: date_chgt, filtre: "activite in ('TN', 'TI')"}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_credit - soldes_debit, filtre: "numero_compte in (70600000, 70610000, 70690000, 70691000)"}
  porte_sur: [flux:f3]
- id: c1c
  type: ecart_somme
  libelle: Achats d'affrètement Akanea contre comptes 6041
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_akanea, valeur: montant_total_achat, date: date_chgt, filtre: "activite in ('AN', 'AI')"}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_debit - soldes_credit, filtre: "numero_compte like '6041%'"}
  porte_sur: [flux:f4]
- id: c2
  type: ecart_somme
  libelle: Gazole COFI hors taxe contre compte 60614000 carburant
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_table, valeur: montant_ht, date: date_heure}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_debit - soldes_credit, filtre: "numero_compte = 60614000"}
  porte_sur: [flux:f5]
- id: c3
  type: ecart_somme
  libelle: Coût global Silae contre comptes 641 à 645 (seuls 641 et 645 existent)
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_silae_cout_salariaux, valeur: cout_global, date: mois, filtre: "matricule is not null"}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_debit - soldes_credit, filtre: "numero_compte >= 64100000 and numero_compte < 64600000"}
  porte_sur: [flux:f7]
- id: c4
  type: rapprochement
  libelle: Immatriculations du carburant retrouvées dans Akanea
  from: sftp_euro_trans_chanet_table.materiel
  to: sftp_euro_trans_chanet_akanea.plaque_moteur
  norm: alnum_upper
  seuil: 0.9
  porte_sur: [sftp_euro_trans_chanet_table.materiel, sftp_euro_trans_chanet_akanea.plaque_moteur]
- id: c5
  type: mensuel
  libelle: Balance Sage sans date par ligne
  ds: sftp_euro_trans_chanet_balance
  porte_sur: [sftp_euro_trans_chanet_balance.soldes_debit, sftp_euro_trans_chanet_balance.soldes_credit]
- id: c6
  type: ecart_somme
  libelle: Péages de l'outil de parc contre compte 62511000 Autoroutes
  annee: 2025
  tolerance: 0.05
  a: {ds: sftp_euro_trans_chanet_tabletotalcout, valeur: cout_total, date: date, filtre: "famille_rub = 'PEAGES'"}
  b: {ds: sftp_euro_trans_chanet_balance, valeur: soldes_debit - soldes_credit, filtre: "numero_compte = 62511000"}
  porte_sur: [flux:f6]
- id: c7
  type: mensuel
  libelle: Akanea, une date de chargement par ordre
  ds: sftp_euro_trans_chanet_akanea
  date: date_chgt
  porte_sur: [sftp_euro_trans_chanet_akanea.date_chgt]
