              values: ["AFFR", "AMORT", "ASS", "ASS ST", "AUTRES", "CA AFF", "CA LOG", "CA PARTIEL", "CA POLE", "CA TOTAL", "CA TPS", "CA TPS TOT", "CH EXEP", "DISTANCE", "DIV", "Egal", "ENERGIE", "ENT", "ENTR", "ENTRE", "ENTRETIEN", "ESSENCE", "FOUR", "FRAIS", "FRAIS FI", "FRAIS PASS", "GAZ", "GO", "INFO", "JOUR", "LOC", "LOCATION", "MASSE", "PEAGE", "PNEU", "PR EXEP", "SALAIRE", "ST AFF", "ST POLE", "ST TPS", "ST TPS TOT", "STRUCT", "SYNTHESE", "TAXE", "TAXE ESS", "TAXE FON", "TAXE PRO", "TEL", "TEL+INFO", "TICPE"]
