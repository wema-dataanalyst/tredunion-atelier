  - name: faits
    description: "Table longue FAITS du modèle Qlik"
    columns:
      - name: "%KEY_VEHICULE"
        description: "Véhicule (immatriculation normalisée)"
        quote: true
        data_tests:
          - relationships:
              to: ref('dim_vehicule')
              field: '"%KEY_VEHICULE"'
              config:
                severity: warn
      - name: "%LIB_SITE"
        description: "Site"
        quote: true
      - name: "%COD_CATEGORIE"
        description: "Code catégorie"
        quote: true
        data_tests:
          - not_null
